name: Build and Publish Multi-Arch Docker Images

on:
  workflow_dispatch:
    inputs:
      build_base:
        description: 'Rebuild and push pi-kot-base (heavy base image)?'
        type: boolean
        default: false
      tag:
        description: 'Image tag to publish (default: latest)'
        type: string
        default: 'latest'
  push:
    tags:
      - 'v*'

jobs:
  build-base:
    # Only run if explicitly requested in workflow_dispatch or if running from a git release tag
    if: github.event.inputs.build_base == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for base image
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/pi-kot-base
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'latest' }}
            type=semver,pattern={{version}}

      - name: Build and push pi-kot-base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-app:
    needs: [build-base]
    if: always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for app image
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/pi-kot
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'latest' }}
            type=semver,pattern={{version}}

      - name: Determine base image reference
        id: base-ref
        run: |
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/pi-kot-base:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push pi-kot app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ steps.base-ref.outputs.image }}
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
