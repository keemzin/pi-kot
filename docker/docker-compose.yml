# Single-tenant pi-kot.
#   cd docker && docker compose up -d --build
#
# Bind mounts, env-var rationale, and operator trade-offs:
# see ../docs/containers.md.

services:
  # Base image build target (Python 3.12, Node 22, Playwright, hound-mcp).
  # Run `docker compose --profile base build pi-kot-base` or `./build.sh --base`
  # only when updating heavy base system dependencies.
  pi-kot-base:
    image: pi-kot-base:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.base
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        PTOOLS_UID: ${AGENT_TOOL_UID:-1001}
        PTOOLS_GID: ${AGENT_TOOL_GID:-1001}
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
    profiles:
      - base

  # Application runtime image.
  # Builds in ~15-20 seconds on daily code edits.
  pi-kot:
    image: pi-kot:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${CONTAINER_NAME:-pi-kot}
    restart: unless-stopped
    # 1GB shared memory for Playwright Chromium stability (prevents crash on heavy pages)
    shm_size: 1gb
    # Start container entrypoint as root so it can dynamically align PUID/PGID,
    # configure sudoers, or drop privileges via gosu / sandbox.
    user: "0:0"
    ports:
      # pi-kot Web UI (container 3000 -> host $HOST_PORT)
      - "${HOST_PORT:-3333}:3000"
      # Dev server port forwards (apps run inside container accessible on host)
      - "${DEV_PORT_VITE:-5173}:5173"   # Vite / SvelteKit / Astro
      - "${DEV_PORT_NODE:-3001}:3001"   # Next.js / Express (container 3000 is pi-kot)
      - "${DEV_PORT_API:-8001}:8000"    # Python FastAPI / Uvicorn (mapped to host 8001 to avoid host 8000 clash)
      - "${DEV_PORT_WEB:-8081}:8080"    # Web / Vue / Spring (mapped to host 8081 to avoid host 8080 clash)
      - "${DEV_PORT_FLASK:-5000}:5000"  # Flask / general backend
    volumes:
      - ${WORKSPACE_HOST_PATH:-./workspace}:/workspace
      - ${PI_CONFIG_HOST_PATH:-~/.pi/agent}:/home/pi/.pi/agent
      # Separate default from host so the container manages its own project list
      - ${KOT_DATA_HOST_PATH:-~/.pi-kot-docker}:/home/pi/.pi-kot
      # Optional: persist /opt if third-party tools or SDKs are installed there
      # - ${OPT_HOST_PATH:-~/.pi-kot-docker/opt}:/opt
    environment:
      # Dynamic UID/GID alignment (LinuxServer.io pattern: adjusts at boot without rebuilding images)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PTOOLS_UID: ${AGENT_TOOL_UID:-1001}
      PTOOLS_GID: ${AGENT_TOOL_GID:-1001}
      # Container-internal paths — fixed.
      WORKSPACE_PATH: /workspace
      PI_CONFIG_DIR: /home/pi/.pi/agent
      FORGE_DATA_DIR: /home/pi/.pi-kot
      PORT: "3000"
      HOST_PORT: ${HOST_PORT:-3333}
      # Auth — read from .env. Both empty = auth disabled.
      UI_PASSWORD: ${UI_PASSWORD:-}
      API_KEY: ${API_KEY:-}
      # Sudo permission toggle (false | true | all)
      ENABLE_SUDO: ${ENABLE_SUDO:-false}
      # Logging + reverse-proxy hint.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    # Hardening. Drop all capabilities by default and add back only the
    # minimal set required for gosu privilege demotion, sudo, and usermod.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - AUDIT_WRITE
    pids_limit: 512
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
